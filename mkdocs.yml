# ---------------------------------------------------------------------------
# Reusable MkDocs + Material template.
# To start a new subject, edit: site identity, `nav`, and (optionally) palette.
# ---------------------------------------------------------------------------

# --- Site identity (EDIT PER SUBJECT) --------------------------------------
site_name: Data Mining dan Machine Learning
site_description: Materi belajar Data Mining dan Machine Learning dengan Python (bahasa Indonesia).
# Canonical URL. For GitHub Pages: https://<user>.github.io/<repo>/
site_url: https://topekox.github.io/mkdocs-template/

# --- Theme (shared) --------------------------------------------------------
theme:
  name: material
  language: id
  font: false # system fonts; no Google Fonts request
  features:
    - navigation.indexes
    - navigation.path # breadcrumbs
    - navigation.footer # previous / next links
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  # Native three-state switcher: System -> Light -> Dark.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: "Theme: system (click for light)"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: "Theme: light (click for dark)"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: "Theme: dark (click for system)"

